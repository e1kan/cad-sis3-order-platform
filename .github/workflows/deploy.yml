name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  STACK_NAME: cad-sis3-app
  NETWORK_STACK: cad-sis3-network

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install cfn-lint -r app/requirements.txt
      - name: Lint the CloudFormation templates
        run: cfn-lint infra/network.yaml infra/app.yaml
      - name: Unit tests
        run: python -m unittest discover -s app -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the ECR repository of the stack
        run: |
          q() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                  --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "REPO_URI=$(q RepositoryUri)"   >> "$GITHUB_ENV"
          echo "REPO_NAME=$(q RepositoryName)" >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        run: |
          if [ -z "$REPO_URI" ]; then
            echo "Внимание: REPO_URI пустой (стек еще не создан). Пропускаем логин."
            exit 0
          fi
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin "${REPO_URI%%/*}"

      - name: Build and push the image (via Buildx)
        if: env.REPO_URI != ''
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ env.REPO_URI }}:${{ github.sha }}
          platforms: linux/amd64

      - name: Deploy the stack with the new image tag
        run: |
          aws cloudformation deploy --stack-name "$STACK_NAME" \
            --template-file infra/app.yaml \
            --parameter-overrides NetworkStackName="$NETWORK_STACK" ImageTag="$GITHUB_SHA" DesiredCount=2 \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset

      # Если стек создавался с нуля, образа в ECR еще нет. Собираем и пушим его после создания стека.
      - name: Push image if stack was just created
        if: env.REPO_URI == ''
        run: |
          q() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                  --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          export REPO_URI=$(q RepositoryUri)
          export REPO_NAME=$(q RepositoryName)
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
          docker build --platform linux/amd64 -t "$REPO_URI:$GITHUB_SHA" app/
          docker push "$REPO_URI:$GITHUB_SHA"
          
          # Обновляем стек с новым образом
          aws cloudformation deploy --stack-name "$STACK_NAME" \
            --template-file infra/app.yaml \
            --parameter-overrides NetworkStackName="$NETWORK_STACK" ImageTag="$GITHUB_SHA" DesiredCount=2 \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset

      - name: Smoke test through the load balancer
        run: |
          ALB=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                  --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" --output text)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "http://$ALB/health"

      - name: Show the new task definition revision
        run: |
          {
            echo "### Deployed commit \`$GITHUB_SHA\`"
            aws ecs describe-task-definition --task-definition "$STACK_NAME-api" \
              --query 'taskDefinition.[family,revision,containerDefinitions[0].image]' --output text
          } | tee -a "$GITHUB_STEP_SUMMARY"
