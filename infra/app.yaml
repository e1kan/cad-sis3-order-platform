AWSTemplateFormatVersion: "2010-09-09"
Description: SIS 3 order platform - ECR, ECS Fargate behind ALB, SNS -> SQS (+DLQ) -> idempotent Lambda consumer, DynamoDB

Parameters:
  NetworkStackName:
    Type: String
    Default: cad-sis3-network
    Description: Name of the network stack whose exports this stack imports
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  ImageTag:
    Type: String
    Description: Image tag in ECR (the git commit SHA). The template never uses "latest".
  DesiredCount:
    Type: Number
    Default: 0
    Description: Number of API tasks. 0 for the first deploy, because the image is not in ECR yet.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Mappings:
  Sizing:
    dev:  { Cpu: 256, Memory: 512 }
    prod: { Cpu: 512, Memory: 1024 }

Resources:
  # ------------------------------------------------------------ ECR
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "drop untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ------------------------------------------------------------ Messaging
  OrdersTopic:
    Type: AWS::SNS::Topic

  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600        # 14 days, longer than the source queue
      SqsManagedSseEnabled: true

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60                  # >= 6 x Lambda timeout (10 s)
      MessageRetentionPeriod: 345600         # 4 days
      ReceiveMessageWaitTimeSeconds: 20      # long polling
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        maxReceiveCount: 5

  # DLQ for the SNS -> SQS delivery step (the other asynchronous arrow)
  SnsDeliveryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrdersTopic
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Ref OrdersTopic }

  SnsDeliveryDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref SnsDeliveryDLQ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrdersTopic
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt SnsDeliveryDLQ.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Ref OrdersTopic }

  OrdersSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: [OrdersQueuePolicy, SnsDeliveryDLQPolicy]
    Properties:
      TopicArn: !Ref OrdersTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType: [OrderPlaced]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SnsDeliveryDLQ.Arn

  OrdersDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message reached the orders DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt OrdersDLQ.QueueName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SnsDeliveryDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message reached the SNS delivery DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt SnsDeliveryDLQ.QueueName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ------------------------------------------------------------ Data
  # No TableName: CloudFormation generates it, so a later update can never collide on the name.
  # Retain: delete-stack keeps the data. Point-in-time recovery is the second safety net.
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ------------------------------------------------------------ Idempotent consumer (Lambda)
  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-consumer"
      RetentionInDays: !Ref LogRetentionDays

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: consumer-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOrdersQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt OrdersQueue.Arn
              - Sid: WriteOrdersTable
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt OrdersTable.Arn

  ConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt ConsumerRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
      Code:
        ZipFile: |
          import json, logging, os, time
          import boto3
          from botocore.exceptions import ClientError

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          ddb = boto3.client("dynamodb")
          TABLE = os.environ["TABLE_NAME"]
          TTL_SECONDS = 7 * 24 * 3600


          def process(body):
              event = json.loads(body)
              order_id = event["orderId"]  # business key = idempotency (deduplication) key
              now = int(time.time())
              try:
                  ddb.transact_write_items(TransactItems=[
                      {"Put": {"TableName": TABLE,
                               "Item": {"pk": {"S": "IDEMP#" + order_id},
                                        "expiresAt": {"N": str(now + TTL_SECONDS)}},
                               "ConditionExpression": "attribute_not_exists(pk)"}},
                      {"Put": {"TableName": TABLE,
                               "Item": {"pk": {"S": "ORDER#" + order_id},
                                        "customerId": {"S": event["customerId"]},
                                        "total": {"N": str(event["total"])},
                                        "status": {"S": "PROCESSED"},
                                        "processedAt": {"N": str(now)}}}},
                  ])
                  log.info("processed orderId=%s", order_id)
              except ClientError as e:
                  if e.response["Error"]["Code"] == "TransactionCanceledException":
                      reasons = [r.get("Code") for r in e.response.get("CancellationReasons", [])]
                      if "ConditionalCheckFailed" in reasons:
                          log.info("duplicate ignored orderId=%s", order_id)
                          return
                  raise


          def handler(event, context):
              failed = []
              for record in event["Records"]:
                  try:
                      process(record["body"])
                  except Exception:
                      log.exception("failed messageId=%s", record["messageId"])
                      failed.append({"itemIdentifier": record["messageId"]})
              return {"batchItemFailures": failed}

  ConsumerMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !Ref ConsumerFunction
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2

  # ------------------------------------------------------------ Containers: logs, roles
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-api"
      RetentionInDays: !Ref LogRetentionDays

  # Role 1: used by ECS itself, before our code runs (pull image, write logs)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Role 2: used by the application code (publish to ONE topic, nothing else)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-orders-topic
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OrdersTopic

  # ------------------------------------------------------------ Network edge: ALB and security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public listener of the load balancer
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP from the internet }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks accept traffic only from the ALB
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: App port from the ALB only }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-PublicSubnetA" }
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-PublicSubnetB" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip                         # Fargate (awsvpc) needs ip, not instance
      Protocol: HTTP
      Port: 8080
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  # ------------------------------------------------------------ ECS Fargate
  Cluster:
    Type: AWS::ECS::Cluster

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !FindInMap [Sizing, !Ref Env, Cpu]
      Memory: !FindInMap [Sizing, !Ref Env, Memory]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          Essential: true
          StopTimeout: 30
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          Environment:
            - { Name: TOPIC_ARN, Value: !Ref OrdersTopic }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: ENV, Value: !Ref Env }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets:
            - { "Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnetA" }
            - { "Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnetB" }
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryName:
    Value: !Ref Repository
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  TopicArn:
    Value: !Ref OrdersTopic
  QueueUrl:
    Value: !Ref OrdersQueue
  DlqUrl:
    Value: !Ref OrdersDLQ
  TableName:
    Value: !Ref OrdersTable
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TargetGroupArn:
    Value: !Ref TargetGroup
